name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    name: vitepress build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 仓库提交的是 package-lock.json（Dockerfile 也走 npm），没有 bun.lock：
      # 用 npm ci 才能按已提交的锁文件做可复现安装。
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: npm ci
        run: npm ci
      - name: vitepress build
        run: npm run build
      - name: 死链自查（.vitepress 侧栏指向的文件必须存在）
        run: |
          node -e 'const fs=require("fs");const cfg=fs.readFileSync("docs/.vitepress/config.mts","utf8");const links=[...cfg.matchAll(/link: .\/([a-z0-9-]+)./g)].map(m=>m[1]);const missing=links.filter(l=>!fs.existsSync("docs/"+l+".md"));if(missing.length){console.error("侧栏指向不存在的页面:",missing);process.exit(1)}console.log("侧栏链接全部存在:",links.length,"条")'
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
